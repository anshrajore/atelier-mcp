<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="scoreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#0d161e" />
      <stop offset="100%" stop-color="#06090c" />
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
    <linearGradient id="teacherBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <pattern id="scoreGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#152430" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="12" fill="url(#scoreBg)" stroke="#1a2b38" stroke-width="1.5" />
  <rect width="1200" height="420" rx="12" fill="url(#scoreGrid)" opacity="0.6" />

  <!-- Title Section -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" fill="#00e5ff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">BENCHMARK RECALL SCOREBOARD</text>
    <text x="0" y="24" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="12">Post-generation quality violation detection against mechanical ground truth checks</text>
  </g>

  <!-- Score Chart Rows -->
  <g transform="translate(60, 110)">
    
    <!-- Row 1: Vanilla AI Agent -->
    <g transform="translate(0, 0)">
      <text x="0" y="22" fill="#cfd8dc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Vanilla Agent (GPT-4o/Sonnet)</text>
      <text x="320" y="22" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="11">No Critic Gate</text>
      
      <!-- Track -->
      <rect x="460" y="6" width="500" height="24" rx="4" fill="#0b131a" stroke="#162530" stroke-width="1" />
      <!-- Bar: 0% -->
      <rect x="460" y="6" width="2" height="24" rx="4" fill="#37474f" />
      <text x="980" y="23" fill="#546e7a" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700">0.0%</text>
      <text x="1050" y="23" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="11">N/A</text>
    </g>

    <!-- Row 2: Ponytail -->
    <g transform="translate(0, 52)">
      <text x="0" y="22" fill="#cfd8dc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Ponytail (Pre-Prompt Only)</text>
      <text x="320" y="22" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="11">Minimalism rules</text>

      <!-- Track -->
      <rect x="460" y="6" width="500" height="24" rx="4" fill="#0b131a" stroke="#162530" stroke-width="1" />
      <!-- Bar: 15.4% -> 500 * 0.154 = 77px -->
      <rect x="460" y="6" width="77" height="24" rx="4" fill="#546e7a" />
      <text x="980" y="23" fill="#90a4ae" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700">15.4%</text>
      <text x="1050" y="23" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="11">66.7% Prec</text>
    </g>

    <!-- Row 3: Atelier Distilled Fine-Tuned (Highlight) -->
    <g transform="translate(0, 104)">
      <!-- Highlight pill outline -->
      <rect x="-10" y="-4" width="1090" height="44" rx="6" fill="#00e5ff" fill-opacity="0.04" stroke="#00e5ff" stroke-width="1" />
      
      <text x="0" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Atelier Fine-Tuned (Qwen-7B)</text>
      <text x="320" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">Local GGUF (0 USD)</text>

      <!-- Track -->
      <rect x="460" y="6" width="500" height="24" rx="4" fill="#0b131a" stroke="#162530" stroke-width="1" />
      <!-- Bar: 92.1% -> 500 * 0.921 = 460px -->
      <rect x="460" y="6" width="460.5" height="24" rx="4" fill="url(#cyanBar)" />
      <text x="980" y="24" fill="#00e5ff" font-family="'Orbitron', sans-serif" font-size="14" font-weight="800">92.1%</text>
      <text x="1050" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">93.5% Prec</text>
    </g>

    <!-- Row 4: Atelier Frontier Teacher -->
    <g transform="translate(0, 156)">
      <text x="0" y="22" fill="#cfd8dc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Atelier Frontier (Sonnet 3.5)</text>
      <text x="320" y="22" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="11">Cloud API ($14.20/1k)</text>

      <!-- Track -->
      <rect x="460" y="6" width="500" height="24" rx="4" fill="#0b131a" stroke="#162530" stroke-width="1" />
      <!-- Bar: 95.7% -> 500 * 0.957 = 478.5px -->
      <rect x="460" y="6" width="478.5" height="24" rx="4" fill="url(#teacherBar)" />
      <text x="980" y="23" fill="#00b4d8" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700">95.7%</text>
      <text x="1050" y="23" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="11">94.8% Prec</text>
    </g>

    <!-- Row 5: Atelier Heuristics Engine -->
    <g transform="translate(0, 208)">
      <text x="0" y="22" fill="#cfd8dc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Atelier Heuristic Engine</text>
      <text x="320" y="22" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="11">Zero-Dep Static (12ms)</text>

      <!-- Track -->
      <rect x="460" y="6" width="500" height="24" rx="4" fill="#0b131a" stroke="#162530" stroke-width="1" />
      <!-- Bar: 100.0% -> 500px -->
      <rect x="460" y="6" width="500" height="24" rx="4" fill="#00838f" />
      <text x="980" y="23" fill="#26a69a" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700">100.0%</text>
      <text x="1050" y="23" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="11">81.8% Prec</text>
    </g>

  </g>

  <!-- Metric Labels Footer -->
  <g transform="translate(520, 385)">
    <text x="0" y="0" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="10">0%</text>
    <text x="125" y="0" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="10">25%</text>
    <text x="250" y="0" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="10">50%</text>
    <text x="375" y="0" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="10">75%</text>
    <text x="490" y="0" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="10">100%</text>
  </g>
</svg>
