  <path d="M 1182 32 L 1182 18 L 1168 18" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 18 448 L 18 462 L 32 462" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 1182 448 L 1182 462 L 1168 462" fill="none" stroke="#ffffff" stroke-width="1.5" />

  <!-- Top Title Header -->
