      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <pattern id="scoreBwGrid" width="24" height="24" patternUnits="userSpaceOnUse">
