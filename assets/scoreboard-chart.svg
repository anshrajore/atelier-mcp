      <text x="105" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1.5">ANSH RAJORE</text>
      <circle cx="300" cy="13" r="3" fill="#ffffff" />
