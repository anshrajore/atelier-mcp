      <text x="890" y="29" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="12" font-weight="800">100.0%</text>

      <text x="960" y="29" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">81.8%</text>
