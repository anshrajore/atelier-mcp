      <rect width="320" height="92" rx="8" fill="#050505" stroke="#333333" stroke-width="1.5" />
      <rect width="320" height="24" rx="8" fill="#141414" />
      <text x="14" y="17" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700">GITHUB COPILOT</text>
      <text x="14" y="46" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Target: .github/copilot-instructions.md</text>
