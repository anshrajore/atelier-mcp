      <text x="14" y="46" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">Target: .agents/rules/atelier.md</text>
      <text x="14" y="66" fill="#cccccc" font-family="'JetBrains Mono', monospace" font-size="10">• Autonomous agent constraint logic</text>
