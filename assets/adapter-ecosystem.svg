    <text x="140" y="23" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">CANONICAL TRUTH</text>
    
    <text x="20" y="65" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">skills/atelier/SKILL.md</text>
