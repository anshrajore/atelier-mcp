<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#0d151c" />
      <stop offset="100%" stop-color="#05080b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16232e" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" stroke="#1a2b38" stroke-width="1.5" />
  <rect width="1200" height="360" rx="12" fill="url(#grid)" opacity="0.6" />
  
  <!-- Subtle accent glow -->
  <circle cx="200" cy="180" r="140" fill="url(#accentGrad)" />
  <circle cx="1000" cy="180" r="120" fill="url(#accentGrad)" />

  <!-- Display Wordmark -->
  <g transform="translate(80, 100)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="138" height="24" rx="4" fill="#0d2330" stroke="#00e5ff" stroke-width="1" />
    <text x="69" y="16" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">OPEN-SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-family="'Orbitron', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="2">ATELIER</text>
    <text x="290" y="72" fill="url(#cyanGrad)" font-family="'Orbitron', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="2">MCP</text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#90a4ae" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="400" letter-spacing="0.5">
      Two-Agent Post-Generation Quality Gate for AI-Generated Code
    </text>

    <!-- Chips / Pillars -->
    <g transform="translate(0, 142)">
      <!-- UI Critic Pill -->
      <rect x="0" y="0" width="220" height="36" rx="6" fill="#0e1b24" stroke="#00e5ff" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#00e5ff" />
      <text x="30" y="23" fill="#cfd8dc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">UI/UX Design Critic</text>

      <!-- Backend Guard Pill -->
      <rect x="236" y="0" width="260" height="36" rx="6" fill="#0e1b24" stroke="#00838f" stroke-width="1" />
      <circle cx="252" cy="18" r="4" fill="#00b4d8" />
      <text x="266" y="23" fill="#cfd8dc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">Backend Architecture Guard</text>

      <!-- Local Model Pill -->
      <rect x="512" y="0" width="220" height="36" rx="6" fill="#0e1b24" stroke="#263238" stroke-width="1" />
      <circle cx="528" cy="18" r="4" fill="#78909c" />
      <text x="542" y="23" fill="#90a4ae" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">Distilled Local Model</text>
    </g>
  </g>

  <!-- Right Visual Element / Graphic Box -->
  <g transform="translate(860, 60)">
    <rect width="260" height="240" rx="10" fill="#0a1218" stroke="#1c303f" stroke-width="1.5" />
    <text x="20" y="36" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">AUDIT_PIPELINE</text>
    
    <!-- Code preview simulation -->
    <rect x="20" y="52" width="220" height="1" fill="#1c303f" />
    
    <text x="20" y="78" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="11">&lt;div className="..."&gt;</text>
    <text x="32" y="98" fill="#ef5350" font-family="'JetBrains Mono', monospace" font-size="11">- bg-gradient-to-r</text>
    <text x="32" y="118" fill="#26a69a" font-family="'JetBrains Mono', monospace" font-size="11">+ bg-surface-primary</text>
    <text x="20" y="138" fill="#546e7a" font-family="'JetBrains Mono', monospace" font-size="11">&lt;/div&gt;</text>

    <!-- Score preview -->
    <rect x="20" y="160" width="220" height="60" rx="6" fill="#080f14" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3 3" />
    <text x="36" y="184" fill="#78909c" font-family="'JetBrains Mono', monospace" font-size="10">OVERALL RECALL</text>
    <text x="36" y="208" fill="#00e5ff" font-family="'Orbitron', sans-serif" font-size="20" font-weight="700">92.1%</text>
    <text x="130" y="208" fill="#90a4ae" font-family="'JetBrains Mono', monospace" font-size="11">0.00 USD / LOCAL</text>
  </g>
</svg>
