    <text x="16" y="19" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">INSPECTION_MATRIX</text>
    <circle cx="295" cy="14" r="3" fill="#ffffff" />
    <circle cx="305" cy="14" r="3" fill="#444444" />

    <!-- Code Delta Telemetry Visual -->
    <g transform="translate(16, 44)">
      <rect width="288" height="68" rx="4" fill="#000000" stroke="#1f1f1f" stroke-width="1" />
      <text x="12" y="20" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10">01  &lt;div className="..."&gt;</text>
      <text x="12" y="36" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">02  - bg-purple-600 shadow-xl</text>
      <text x="12" y="52" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">03  + bg-zinc-900 border-zinc-800</text>
    </g>

    <!-- Metrics Readout Grid -->
    <g transform="translate(16, 126)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="138" height="60" rx="4" fill="#0a0a0a" stroke="#222222" stroke-width="1" />
      <text x="12" y="20" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9">OVERALL RECALL</text>
      <text x="12" y="44" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="800">92.1%</text>
      <text x="82" y="44" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">LOCAL</text>

      <!-- Box 2 -->
      <rect x="150" y="0" width="138" height="60" rx="4" fill="#0a0a0a" stroke="#222222" stroke-width="1" />
      <text x="12" y="20" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9">INFERENCE P95</text>
      <text x="12" y="44" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="800">12ms</text>
      <text x="82" y="44" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">$0.00</text>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="200" x2="304" y2="200" stroke="#1f1f1f" stroke-width="1" />
    <text x="16" y="218" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="9">GATE PASS RECEIPT: #ATELIER-OK-2026</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(60, 342)">
    <text x="0" y="12" fill="#444444" font-family="'JetBrains Mono', monospace" font-size="10">RULESETS: UNIVERSAL (BASE-UI, BASE-BE) + NEXTJS-TAILWIND + N8N</text>
    <text x="840" y="12" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10">MIT LICENSE // DEVELOPED BY ANSH RAJORE</text>
  </g>
</svg>
