<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#222222" />
    </pattern>
    <pattern id="techLines" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="0.75" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="14" fill="url(#bwBg)" stroke="#262626" stroke-width="1.5" />
  <rect width="1200" height="380" rx="14" fill="url(#dotGrid)" opacity="0.8" />
  <rect width="1200" height="380" rx="14" fill="url(#techLines)" opacity="0.4" />

  <!-- Corner Precision Accents -->
  <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 1182 34 L 1182 18 L 1166 18" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 18 346 L 18 362 L 34 362" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 1182 346 L 1182 362 L 1166 362" fill="none" stroke="#ffffff" stroke-width="1.5" />

  <!-- Top System Header Bar -->
  <g transform="translate(60, 36)">
    <!-- Status Indicator -->
    <circle cx="6" cy="6" r="4" fill="#ffffff" />
    <text x="18" y="10" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">SYS.SPEC // PROTOCOL: MCP-v1.0</text>
    
    <!-- Version Tag -->
    <rect x="360" y="-2" width="110" height="20" rx="3" fill="#111111" stroke="#333333" stroke-width="1" />
    <text x="415" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">v1.0.0-PROD</text>

    <!-- Author Badge -->
    <g transform="translate(740, -4)">
      <rect width="340" height="24" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-width="1" />
      <text x="12" y="16" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">ENGINEERED BY</text>
      <text x="110" y="16" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1.5">ANSH RAJORE</text>
      <circle cx="320" cy="12" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="60" y1="72" x2="1140" y2="72" stroke="#222222" stroke-width="1" />

  <!-- Left Main Wordmark & Description -->
  <g transform="translate(60, 105)">
    <!-- Primary Display Title -->
    <text x="0" y="56" fill="#ffffff" font-family="'Orbitron', -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="4">ATELIER</text>
    <text x="375" y="56" fill="#555555" font-family="'Orbitron', -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="4">//</text>
    <text x="430" y="56" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="300" letter-spacing="2">GATE</text>

    <!-- Subtitle Description -->
    <text x="0" y="100" fill="#a0a0a0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" letter-spacing="0.5">
      Two-Agent Post-Generation Quality Gate for AI-Generated Code
    </text>
    <text x="0" y="124" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="400">
      Deterministic UI/UX Token Scaler + Zero-Trust Backend Architecture Guard
    </text>

    <!-- Feature Pillars (Black & White Technical Badges) -->
    <g transform="translate(0, 155)">
      <!-- UI Critic Pill -->
      <rect x="0" y="0" width="220" height="38" rx="4" fill="#0a0a0a" stroke="#444444" stroke-width="1" />
      <rect x="8" y="8" width="22" height="22" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-width="1" />
      <text x="19" y="23" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">UI</text>
      <text x="38" y="24" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">UI/UX Critic</text>

      <!-- Backend Guard Pill -->
      <rect x="232" y="0" width="260" height="38" rx="4" fill="#0a0a0a" stroke="#444444" stroke-width="1" />
      <rect x="240" y="8" width="22" height="22" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-width="1" />
      <text x="251" y="23" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">BE</text>
      <text x="270" y="24" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Backend Guard</text>

      <!-- Local Model Pill -->
      <rect x="504" y="0" width="220" height="38" rx="4" fill="#0a0a0a" stroke="#444444" stroke-width="1" />
      <rect x="512" y="8" width="22" height="22" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-width="1" />
      <text x="523" y="23" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">7B</text>
      <text x="542" y="24" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Distilled GGUF</text>
    </g>
  </g>

  <!-- Right Technical Telemetry HUD Box -->
  <g transform="translate(820, 95)">
    <rect width="320" height="235" rx="8" fill="#050505" stroke="#333333" stroke-width="1.5" />
    
    <!-- Top HUD Bar -->
